[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "git-spectre"
version = "0.1.0"
description = "The Haunted Git History & Digital Séance CLI — summon the ghosts of your repository with a local open-weight AI. 100% offline, 100% private."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Jimin Lee" }]
keywords = ["git", "halloween", "hacktoberfest", "gemma", "ollama", "cli", "dead-code", "dias-de-los-muertos"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Version Control :: Git",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "typer>=0.9",
  "rich>=13.0",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/kingmin8768/git-spectre"

[project.scripts]
git-spectre = "git_spectre.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["git_spectre"]

[tool.pytest.ini_options]
testpaths = ["tests"]
